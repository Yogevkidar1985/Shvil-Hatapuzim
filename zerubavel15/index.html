<title>זרובבל 15 — סטטוס דירות</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --navy:#1B2467; --navy-deep:#12173F; --navy-ink:#1E2246;
    --cream:#F6E9E1; --paper:#FFFDF9; --tan:#D0A88C; --tan-deep:#B98D6E;
    --line:#E4D5C8; --muted:#6E6A7E;
    --st-marketing:#2F7D4E; --st-negotiation:#1B2467; --st-reserved:#7A7264; --st-sold:#B23F38;
    --radius:14px;
    --shadow:0 2px 10px rgba(27,36,103,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }
  body{
    margin:0; background:var(--cream); color:var(--navy-ink);
    font-family:-apple-system,"Segoe UI","Noto Sans Hebrew","Heebo",Arial,sans-serif;
    direction:rtl; line-height:1.5;
  }
  button{font-family:inherit}
  button:focus-visible, [contenteditable]:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--tan); outline-offset:2px; border-radius:6px;
  }

  /* ===== Header ===== */
  header.site{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy) 55%,#252F7E);
    color:#fff; padding:26px 22px 22px;
  }
  .site-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .logo-img{width:118px;height:auto;display:block;border-radius:8px}
  .site h1{margin:0;font-size:34px;font-weight:800;letter-spacing:.01em;text-wrap:balance}
  .site .sub{margin:2px 0 0;color:var(--tan);font-weight:600;font-size:17px}
  .site .addr{margin:2px 0 0;color:#C7CCEF;font-size:14px}
  .head-actions{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{
    border:1.5px solid rgba(255,255,255,.45); background:rgba(255,255,255,.07); color:#fff;
    padding:9px 16px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn.tan{background:var(--tan);border-color:var(--tan);color:var(--navy-deep)}
  .btn.tan:hover{background:#DDBA9F}
  .btn.on{background:var(--tan);border-color:var(--tan);color:var(--navy-deep)}
  [contenteditable="true"]{border-bottom:1.5px dashed var(--tan);cursor:text}

  /* ===== KPI strip ===== */
  .kpis{max-width:1180px;margin:-1px auto 0;padding:0 22px}
  .kpi-card{
    background:var(--navy); color:#fff; border-radius:0 0 var(--radius) var(--radius);
    display:grid; grid-template-columns:repeat(5,1fr); text-align:center;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .kpi{padding:14px 8px;border-inline-start:1px solid rgba(255,255,255,.14)}
  .kpi:first-child{border-inline-start:none}
  .kpi b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .kpi span{font-size:12.5px;color:#C7CCEF}
  .kpi .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:1px}

  /* ===== Layout ===== */
  main{max-width:1180px;margin:26px auto 40px;padding:0 22px;display:grid;grid-template-columns:430px 1fr;gap:24px;align-items:start}
  @media (max-width:960px){ main{grid-template-columns:1fr} .viz-panel{position:static} }

  /* ===== Building visualization panel ===== */
  .viz-panel{position:sticky;top:16px}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .viz-tabs{display:flex;gap:8px;margin-bottom:14px}
  .viz-tabs button{
    flex:1;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);
    background:transparent;color:var(--navy-ink);font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .viz-tabs button.act{background:var(--navy);border-color:var(--navy);color:#fff}
  .panel h2{margin:0 0 4px;font-size:17px;font-weight:800;color:var(--navy)}
  .panel .hint{margin:0 0 12px;font-size:12.5px;color:var(--muted)}

  /* schematic */
  .bld{display:flex;flex-direction:column;gap:5px;padding:6px 2px 0}
  .bld-roof{height:12px;border-radius:6px 6px 0 0;margin:0 66px 0 26px;
    background:repeating-linear-gradient(90deg,var(--navy) 0 7px,transparent 7px 13px);opacity:.85}
  .bfloor{display:flex;gap:5px;align-items:stretch}
  .fbadge{
    flex:0 0 30px;align-self:center;height:30px;display:grid;place-items:center;
    background:var(--navy);color:#fff;border-radius:8px;font-size:14px;font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .bunits{flex:1;display:flex;gap:5px;min-height:58px}
  .bunit{
    flex:1;border-radius:9px;border:2px solid;display:flex;flex-direction:column;justify-content:center;
    padding:6px 10px;cursor:pointer;text-align:right;background:#fff;
    transition:transform .12s,box-shadow .12s;position:relative;min-width:0;
  }
  .bunit:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(27,36,103,.18)}
  .bunit b{font-size:13px;font-weight:800;color:var(--navy-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bunit i{font-style:normal;font-size:11px;font-weight:700;white-space:nowrap}
  .terr{
    flex:0 0 52px;border:2px dashed var(--tan-deep);border-radius:9px;background:rgba(208,168,140,.14);
    display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--tan-deep);text-align:center;line-height:1.25;
  }
  .garden{
    flex:0 0 84px;border:2px solid #5C8A46;border-radius:9px;color:#3F6630;
    background:repeating-linear-gradient(45deg,rgba(112,160,84,.16) 0 6px,rgba(112,160,84,.28) 6px 12px);
    display:grid;place-items:center;font-size:11px;font-weight:800;text-align:center;line-height:1.3;
  }
  .bld-ground{height:10px;border-radius:3px;margin-top:2px;
    background:linear-gradient(90deg,var(--tan) 0%,var(--tan-deep) 100%)}
  .bld-street{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 36px 0 4px}

  /* render photo */
  .photo-wrap{position:relative;border-radius:10px;overflow:hidden;display:none}
  .photo-wrap img{width:100%;display:block}
  .pbadge{
    position:absolute;width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:14px;cursor:pointer;border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;
  }
  .pbadge:hover{background:var(--tan);color:var(--navy-deep)}

  /* legend */
  .legend{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .legend h3{margin:0 0 8px;font-size:13.5px;font-weight:800;color:var(--navy)}
  .legend .row{display:flex;gap:8px;flex-wrap:wrap}

  /* ===== Status pills ===== */
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;
    color:#fff;font-size:12.5px;font-weight:800;border:none;cursor:pointer;white-space:nowrap;
  }
  .pill svg{flex:0 0 auto}
  .pill.static{cursor:default}

  /* ===== Floors list ===== */
  .floors{display:flex;flex-direction:column;gap:16px}
  .floor{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .floor-head{
    display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(208,168,140,.14);
    border-bottom:1px solid var(--line);
  }
  .floor-chip{background:var(--navy);color:#fff;font-weight:800;font-size:13.5px;padding:5px 14px;border-radius:8px}
  .floor-head .cnt{font-size:12.5px;color:var(--muted);font-weight:600}
  .floor-head .tools{margin-inline-start:auto;display:flex;gap:6px}
  .mini-btn{
    border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;
    font-size:12px;font-weight:700;padding:4px 10px;cursor:pointer;
  }
  .mini-btn:hover{border-color:var(--tan-deep)}
  .mini-btn.danger{color:var(--st-sold)}
  .apt{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .apt:last-child{border-bottom:none}
  .apt.flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%,60%{background:rgba(208,168,140,.32)}100%{background:transparent}}
  .apt .info{flex:1;min-width:0}
  .apt .name{font-size:16.5px;font-weight:800;color:var(--navy)}
  .apt .name .rooms{color:var(--tan-deep);font-weight:800}
  .specs{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:13px;color:var(--muted)}
  .specs b{color:var(--navy-ink);font-weight:700;font-variant-numeric:tabular-nums}
  .apt .side{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .apt .note{font-size:12px;color:var(--muted);margin-top:3px}

  /* edit fields */
  .efield{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:700}
  .efield input{
    border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13.5px;
    font-family:inherit;color:var(--navy-ink);background:#fff;width:100%;
  }
  .egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .egrid .wide{grid-column:1/-1}
  .status-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .status-picker button{
    padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer;
    background:#fff;border:2px solid var(--line);color:var(--muted);
  }
  .add-floor{align-self:center}

  /* status menu popover */
  .smenu{
    position:absolute;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 24px rgba(27,36,103,.22);padding:8px;display:flex;flex-direction:column;gap:6px;
  }
  .smenu .pill{justify-content:flex-start}

  /* toast */
  .toast{
    position:fixed;bottom:22px;inset-inline-start:22px;background:var(--navy);color:#fff;
    padding:10px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.28);
    opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:99;
  }
  .toast.show{opacity:1;transform:none}

  footer.site{
    background:var(--navy-deep);color:#C7CCEF;margin-top:14px;padding:20px 22px;text-align:center;font-size:13.5px;
  }
  footer.site b{color:var(--tan)}
</style>

      const s = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));

    }catch(e){/* bad hash — fall through */}
  }
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.floors) return s;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState(silent){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  try{
    history.replaceState(null,'', '#d='+btoa(unescape(encodeURIComponent(JSON.stringify(state)))));
  }catch(e){}
  if(!silent) toast('נשמר ✓');
  renderAll();
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const el = (tag, cls, html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tint = (hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;};
function findApt(id){ for(const f of state.floors) for(const a of f.apts) if(a.id===id) return {f,a}; return null; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }

/* ---------- status pill + menu ---------- */
function pillHTML(st){
  const s = STATUSES[st] || STATUSES.marketing;
  return `<span aria-hidden="true">${s.icon}</span>${esc(s.label)}`;
}
let openMenu = null;
function closeMenu(){ if(openMenu){openMenu.remove();openMenu=null;} }
document.addEventListener('click', e=>{ if(openMenu && !openMenu.contains(e.target)) closeMenu(); }, true);

function makePill(a){
  const s = STATUSES[a.status] || STATUSES.marketing;
  const b = el('button','pill', pillHTML(a.status));
  b.style.background = s.color;
  b.title = 'לחיצה לשינוי סטטוס';
  b.setAttribute('aria-label', `סטטוס: ${s.label} — לחיצה לשינוי`);
  b.addEventListener('click', ev=>{
    ev.stopPropagation(); closeMenu();
    const m = el('div','smenu');
    for (const k of Object.keys(STATUSES)){
      const o = el('button','pill', pillHTML(k) + (k===a.status?' ✓':''));
      o.style.background = STATUSES[k].color;
      o.addEventListener('click', ()=>{ a.status=k; closeMenu(); saveState(); toast(`עודכן: ${STATUSES[k].label}`); });
      m.appendChild(o);
    }
    document.body.appendChild(m);
    const r = b.getBoundingClientRect();
    m.style.top = (r.bottom + window.scrollY + 6)+'px';
    let x = r.left + window.scrollX; if (x + 170 > document.documentElement.clientWidth) x = r.right + window.scrollX - 170;
    m.style.left = Math.max(8,x)+'px';
    openMenu = m;
  });
  return b;
}

/* ---------- KPIs + legend ---------- */
function renderKpis(){
  const counts = {marketing:0,negotiation:0,reserved:0,sold:0}; let total=0;
  for(const f of state.floors) for(const a of f.apts){ total++; counts[a.status]=(counts[a.status]||0)+1; }
  const k = $('#kpis'); k.innerHTML='';
  k.appendChild(el('div','kpi',`<b>${total}</b><span>סה״כ דירות</span>`));
  for (const key of ['marketing','negotiation','reserved','sold']){
    const s=STATUSES[key];
    k.appendChild(el('div','kpi',
      `<b>${counts[key]||0}</b><span><i class="dot" style="background:${key==='negotiation'?'#8FA0E8':s.color}"></i>${esc(s.label)}</span>`));
  }
  const lg = $('#legend'); lg.innerHTML='';
  for (const key of Object.keys(STATUSES)){
    const p = el('span','pill static', pillHTML(key));
    p.style.background = STATUSES[key].color;
    lg.appendChild(p);
  }
}

/* ---------- building schematic ---------- */
function renderBld(){
  const wrap = $('#bld'); wrap.innerHTML='';
  wrap.appendChild(el('div','bld-roof'));
  const floors = [...state.floors].sort((x,y)=>y.num-x.num);
  for (const f of floors){
    const row = el('div','bfloor');
    const units = el('div','bunits');
    for (const a of f.apts){
      if (a.kind==='penthouse') units.appendChild(el('div','terr','מרפסת<br>50 מ״ר'));
      const s = STATUSES[a.status] || STATUSES.marketing;
      const u = el('div','bunit');
      u.style.borderColor = s.color;
      u.style.background = tint(s.color, .10);
      u.style.flexGrow = Math.max(1, (parseFloat(a.size)||50)/50);
      u.innerHTML = `<b>${esc(a.name)}</b><i style="color:${s.color}">${esc(s.label)}</i>`;
      u.title = `${a.name} · ${a.size} מ״ר · ${s.label}`;
      u.setAttribute('role','button'); u.tabIndex=0;
      const go = ()=>focusApt(a.id);
      u.addEventListener('click',go);
      u.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
      units.appendChild(u);
      if (a.kind==='penthouse') units.appendChild(el('div','terr','מרפסת<br>50 מ״ר'));
      if (a.kind==='garden') units.appendChild(el('div','garden','גינה<br>46 מ״ר'));
    }
    row.appendChild(units);
    const badge = el('button','fbadge', String(f.num));
    badge.title = f.label; badge.setAttribute('aria-label','מעבר ל'+f.label);
    badge.style.border='none'; badge.style.cursor='pointer';
    badge.addEventListener('click',()=>focusFloor(f.id));
    row.appendChild(badge);
    wrap.appendChild(row);
  }
  wrap.appendChild(el('div','bld-ground'));
  wrap.appendChild(el('div','bld-street','<span>רחוב זרובבל ←</span><span>→ רחוב אהרונסון</span>'));

  // photo badges
  const pb = $('#pbadges'); pb.innerHTML='';
  const ys = {6:16,5:28.5,4:41,3:53.5,2:66,1:78};
  for (const f of floors){
    const y = ys[f.num]; if (y==null) continue;
    const b = el('button','pbadge', String(f.num));
    b.style.top = y+'%'; b.style.right = '72%';
    b.setAttribute('aria-label','מעבר ל'+f.label);
    b.addEventListener('click',()=>focusFloor(f.id));
    pb.appendChild(b);
  }
}

function focusApt(id){
  const c = document.getElementById('apt-'+id);
  if(!c) return;
  c.scrollIntoView({block:'center'});
  c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
}
function focusFloor(id){
  const c = document.getElementById('floor-'+id);
  if(c) c.scrollIntoView({block:'start'});
}

/* ---------- floors list ---------- */
function specHTML(a){
  const bits = [];
  bits.push(`<span>שטח: <b>${esc(a.size)} מ״ר</b></span>`);
  if (a.outdoor) bits.push(`<span>${esc(a.outdoor)}</span>`);
  if (a.facing) bits.push(`<span>${esc(a.facing)}</span>`);
  return bits.join('');
}
function renderFloors(){
  const wrap = $('#floors'); wrap.innerHTML='';
  const floors = [...state.floors].sort((x,y)=>y.num-x.num);
  for (const f of floors){
    const card = el('section','floor'); card.id = 'floor-'+f.id;
    const head = el('div','floor-head');
    head.appendChild(el('span','floor-chip',esc(f.label)));
    head.appendChild(el('span','cnt', f.apts.length===1?'דירה אחת':f.apts.length+' דירות'));
    if (editMode){
      const tools = el('div','tools');
      const add = el('button','mini-btn','+ הוספת דירה');
      add.addEventListener('click',()=>{
        f.apts.push(apt(uid(),'דירה חדשה','3 חדרים','70','מרפסת 12 מ״ר','חזית לרחוב זרובבל','big'));
        saveState();
      });
      tools.appendChild(add);
      if (f.apts.length===0){
        const del = el('button','mini-btn danger','מחיקת קומה');
        del.addEventListener('click',()=>{ state.floors = state.floors.filter(x=>x!==f); saveState(); });
        tools.appendChild(del);
      }
      head.appendChild(tools);
    }
    card.appendChild(head);

    for (const a of f.apts){
      const row = el('div','apt'); row.id = 'apt-'+a.id;
      const info = el('div','info');
      if (editMode){
        info.innerHTML = `<div class="egrid">
          <label class="efield">שם הדירה<input data-k="name" value="${esc(a.name)}"></label>
          <label class="efield">חדרים<input data-k="rooms" value="${esc(a.rooms)}" placeholder="למשל: 3 חדרים"></label>
          <label class="efield">שטח (מ״ר)<input data-k="size" value="${esc(a.size)}" inputmode="numeric"></label>
          <label class="efield">מרפסת / גינה<input data-k="outdoor" value="${esc(a.outdoor)}"></label>
          <label class="efield">חזית / כיוון<input data-k="facing" value="${esc(a.facing)}"></label>
          <label class="efield">הערה (יוצג לקונים)<input data-k="note" value="${esc(a.note)}" placeholder="למשל: מחיר, מועד מסירה"></label>
        </div>`;
        info.querySelectorAll('input').forEach(inp=>{
          inp.addEventListener('change',()=>{ a[inp.dataset.k]=inp.value; saveState(true); toast('נשמר ✓'); });
        });
        const sp = el('div','status-picker');
        for (const k of Object.keys(STATUSES)){
          const s=STATUSES[k];
          const b = el('button',null,s.label);
          if (k===a.status){ b.style.background=s.color;b.style.borderColor=s.color;b.style.color='#fff'; }
          b.addEventListener('click',()=>{ a.status=k; saveState(); });
          sp.appendChild(b);
        }
        info.appendChild(sp);
      } else {
        const nm = a.rooms ? `${esc(a.name)} <span class="rooms">| ${esc(a.rooms)}</span>` : esc(a.name);
        info.innerHTML = `<div class="name">${nm}</div><div class="specs">${specHTML(a)}</div>`+
          (a.note?`<div class="note">💬 ${esc(a.note)}</div>`:'');
      }
      row.appendChild(info);

      const side = el('div','side');
      side.appendChild(makePill(a));
      if (editMode){
        const del = el('button','mini-btn danger','מחיקה');
        del.addEventListener('click',()=>{
          if (confirm(`למחוק את "${a.name}"?`)){ f.apts = f.apts.filter(x=>x!==a); saveState(); }
        });
        side.appendChild(del);
      }
      row.appendChild(side);
      card.appendChild(row);
    }
    wrap.appendChild(card);
  }
  if (editMode){
    const addF = el('button','btn tan add-floor','+ הוספת קומה');
    addF.addEventListener('click',()=>{
      const num = Math.max(0,...state.floors.map(f=>f.num))+1;
      state.floors.unshift({id:uid(),num,label:'קומה '+num,apts:[]});
      saveState();
    });
    wrap.appendChild(addF);
    const reset = el('button','mini-btn','↺ איפוס לנתוני ברירת המחדל');
    reset.style.alignSelf='center';
    reset.addEventListener('click',()=>{
      if(confirm('לאפס את כל הנתונים לברירת המחדל? פעולה זו תמחק את כל השינויים.')){
        state = JSON.parse(JSON.stringify(DEFAULT_STATE)); saveState();
      }
    });
    wrap.appendChild(reset);
  }
}

/* ---------- meta (title etc.) ---------- */
function renderMeta(){
  const t=$('#m-title'), s=$('#m-subtitle'), ad=$('#m-address');
  t.textContent = state.meta.title; s.textContent = state.meta.subtitle; ad.textContent = state.meta.address;
  for (const [node,key] of [[t,'title'],[s,'subtitle'],[ad,'address']]){
    node.contentEditable = editMode ? 'true' : 'false';
    node.onblur = editMode ? ()=>{ state.meta[key]=node.textContent.trim(); saveState(true); toast('נשמר ✓'); } : null;
  }
}

/* ---------- top-level render ---------- */
function renderAll(){ renderMeta(); renderKpis(); renderBld(); renderFloors(); }

/* ---------- header actions ---------- */
$('#btn-edit').addEventListener('click',()=>{
  editMode = !editMode;
  $('#btn-edit').classList.toggle('on',editMode);
  $('#btn-edit').textContent = editMode ? '✓ סיום עריכה' : '✎ מצב עריכה';
  renderAll();
  toast(editMode?'מצב עריכה פעיל — כל שדה ניתן לשינוי':'מצב תצוגה');
});
$('#btn-share').addEventListener('click',async ()=>{
  saveState(true);
  const url = location.href;
  try{ await navigator.clipboard.writeText(url); toast('הקישור הועתק — אפשר לשלוח לקונים 🔗'); }
  catch(e){ prompt('העתיקו את הקישור:', url); }
});

/* ---------- viz tabs ---------- */
$('#tab-schema').addEventListener('click',()=>{
  $('#tab-schema').classList.add('act'); $('#tab-photo').classList.remove('act');
  $('#bld').style.display='flex'; $('#photo').style.display='none';
});
$('#tab-photo').addEventListener('click',()=>{
  $('#tab-photo').classList.add('act'); $('#tab-schema').classList.remove('act');
  $('#bld').style.display='none'; $('#photo').style.display='block';
});

renderAll();
</script>
