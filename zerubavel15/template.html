<title>זרובבל 15 — סטטוס דירות</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face{
    font-family:'Assistant';font-style:normal;font-weight:200 800;font-display:swap;
    src:url(__FONT_HEB__) format('woff2');unicode-range:__UR_HEB__;
  }
  @font-face{
    font-family:'Assistant';font-style:normal;font-weight:200 800;font-display:swap;
    src:url(__FONT_LAT__) format('woff2');unicode-range:__UR_LAT__;
  }
  :root{
    --navy:#1B2467; --navy-deep:#10153E; --navy-soft:#2A357E; --ink:#20244A;
    --cream:#F6EDE2; --paper:#FFFDF9; --tan:#D0A88C; --tan-deep:#B98D6E; --tan-soft:rgba(208,168,140,.16);
    --line:#EADDCE; --muted:#787490;
    --st-marketing:#2E7D4E; --st-negotiation:#3D4A9E; --st-reserved:#7A7264; --st-sold:#B23F38;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow-1:none;
    --shadow-2:0 8px 30px rgba(27,36,103,.09);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }
  body{
    margin:0; color:var(--ink);
    background:var(--cream);
    background-image:radial-gradient(90% 40% at 50% 0%, rgba(208,168,140,.14), transparent 70%);
    background-repeat:no-repeat;
    font-family:"Almoni ML v5 AAA","Almoni Neue","Almoni","almoni-dl-aaa","Assistant",-apple-system,"Segoe UI",Arial,sans-serif;
    direction:rtl; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:clip;                      /* מונע גלילה אופקית בלי ליצור מיכל-גלילה שמפריע לגלילה האנכית */
  }
  /* קפיצות עוגן נוחתות עם אוויר מלמעלה */
  .floor, .viz-panel{scroll-margin-top:18px}
  button{font-family:inherit}
  button:focus-visible,[contenteditable]:focus-visible,input:focus-visible{
    outline:3px solid var(--tan); outline-offset:2px; border-radius:8px;
  }
  ::selection{background:var(--tan);color:var(--navy-deep)}

  /* ================= HERO ================= */
  header.site{
    position:relative; color:#fff; padding:34px 26px 68px; overflow:hidden;
    background:linear-gradient(180deg, #1D2670 0%, var(--navy) 62%, #191F55 100%);
  }
  header.site::before{ /* faint blueprint grid */
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.45;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(85% 120% at 78% 0%, #000 30%, transparent 100%);
    -webkit-mask-image:radial-gradient(85% 120% at 78% 0%, #000 30%, transparent 100%);
  }
  header.site::after{ /* warm halo behind the logo */
    content:""; position:absolute; top:-45%; right:-6%; width:56%; height:190%; pointer-events:none;
    background:radial-gradient(closest-side, rgba(208,168,140,.16), transparent 72%);
  }
  .site-inner{position:relative; max-width:1320px; margin:0 auto; display:flex; align-items:center; gap:30px; flex-wrap:wrap}
  .head-brand{display:flex; flex-direction:column; align-items:center; gap:11px}
  .logo-img{width:140px;height:auto;display:block}
  .brand-tag{
    margin:0; color:var(--tan); font-weight:700; font-size:13.5px; letter-spacing:.14em; text-align:center; white-space:nowrap;
  }
  .head-txt{min-width:240px; display:flex; flex-direction:column; align-items:flex-start}
  .site h1{
    margin:0; font-size:clamp(34px,4.2vw,50px); font-weight:800; letter-spacing:-.015em; line-height:1.06;
    text-wrap:balance;
  }
  .site .sub{margin:7px 0 0; color:rgba(240,238,255,.8); font-weight:400; font-size:17px}
  .head-meta{display:flex; align-items:center; gap:9px; margin-top:16px; flex-wrap:wrap}
  .addr-chip{
    display:inline-flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    padding:6px 13px; border-radius:999px; font-size:13px; color:rgba(240,238,255,.88); font-weight:600;
  }
  .addr-chip i{width:6px;height:6px;border-radius:50%;background:var(--tan);display:inline-block}
  .head-actions{margin-inline-start:auto; display:flex; gap:8px; align-items:center}
  /* small, delicate share button */
  .btn-share{
    display:inline-flex; align-items:center; gap:5px;
    border:1px solid rgba(208,168,140,.35); background:transparent; color:rgba(224,196,175,.9);
    padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:600; cursor:pointer;
    letter-spacing:.01em; transition:background .16s, color .16s, border-color .16s;
  }
  .btn-share:hover{background:var(--tan); border-color:var(--tan); color:var(--navy-deep)}
  .btn-share svg{width:11px;height:11px}
  .btn-edit{
    width:26px; height:26px; padding:0; border-radius:7px; cursor:pointer; font-size:12px;
    border:1px solid rgba(255,255,255,.14); background:transparent; color:rgba(240,238,255,.4);
    transition:color .15s, border-color .15s; opacity:.7;
  }
  .btn-edit:hover{opacity:1; color:#fff; border-color:rgba(255,255,255,.4)}
  .btn-edit.on{opacity:1; background:var(--tan); border-color:var(--tan); color:var(--navy-deep); width:auto; padding:0 12px}
  [contenteditable="true"]{border-bottom:1.5px dashed var(--tan); cursor:text}

  /* ================= KPI STRIP — הבר הלבן ================= */
  .kpis{max-width:1320px; margin:-48px auto 0; padding:0 26px; position:relative; z-index:2}
  .kpi-card{
    display:grid; grid-template-columns:repeat(5,1fr); text-align:center; overflow:hidden;
    background:var(--paper);
    border:1px solid var(--line); border-radius:var(--r-md);
    box-shadow:0 18px 50px rgba(16,21,62,.16), 0 2px 8px rgba(16,21,62,.06);
    color:var(--navy);
  }
  .kpi{
    padding:21px 10px 17px; border-inline-start:1px solid var(--line); position:relative;
    transition:background .2s ease;
  }
  .kpi:first-child{border-inline-start:none}
  /* פס צבע עליון בגוון הסטטוס — נחשף בריחוף */
  .kpi::after{
    content:""; position:absolute; inset-inline:0; top:0; height:3px;
    background:var(--kc, var(--line)); opacity:0; transform:scaleX(.4);
    transition:opacity .22s ease, transform .22s ease;
  }
  .kpi:hover::after{opacity:1; transform:scaleX(1)}
  .kpi:hover{background:var(--kbg, rgba(27,36,103,.03))}
  .kpi b{
    display:block; font-size:32px; font-weight:800; font-variant-numeric:tabular-nums;
    line-height:1.1; letter-spacing:-.02em; color:var(--navy);
    transition:transform .22s cubic-bezier(.22,.61,.36,1), color .22s ease;
  }
  .kpi:hover b{transform:translateY(-2px); color:var(--kc, var(--navy-deep))}
  .kpi.total{background:linear-gradient(180deg, rgba(208,168,140,.12), rgba(208,168,140,.03))}
  .kpi.total::after{background:linear-gradient(90deg,var(--tan),var(--tan-deep)); opacity:1; transform:none}
  .kpi.total b{font-size:38px; color:var(--navy-deep)}
  .kpi.total:hover b{color:var(--navy-deep)}
  .kpi span{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.02em}
  .kpi em{display:block; font-style:normal; font-size:10.5px; color:var(--tan-deep); font-weight:800; margin-top:1px; letter-spacing:.03em}
  .kpi .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-end:6px; vertical-align:1px;
    box-shadow:0 0 0 3px var(--kbg, transparent); transition:box-shadow .2s ease;
  }

  /* ================= LAYOUT ================= */
  main{max-width:1320px; margin:34px auto 46px; padding:0 26px; display:grid;
       grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:28px}
  @media (max-width:960px){
    main{grid-template-columns:1fr}
    .viz-panel{order:-1}
    .photo-wrap{flex:none; aspect-ratio:1/1; min-height:0}
    header.site{padding:34px 20px 72px}
  }

  .floors-col{display:flex; flex-direction:column; gap:16px; min-width:0}
  .col-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding-bottom:4px}
  .col-title{margin:0; font-size:30px; font-weight:800; color:var(--navy); letter-spacing:-.02em; line-height:1.12}
  .col-title::after{content:""; display:block; width:66px; height:5px; border-radius:3px; margin-top:10px;
    background:linear-gradient(90deg,var(--tan),var(--tan-deep))}
  .col-upd{font-size:12.5px; color:var(--muted); font-weight:600; padding-bottom:6px}

  /* ================= VIZ PANEL ================= */
  .viz-panel{display:flex; min-width:0}
  .panel{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow-1); padding:20px; display:flex; flex-direction:column; flex:1; min-width:0;
  }
  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:14px}
  .panel h2{margin:0; font-size:19px; font-weight:800; color:var(--navy); letter-spacing:-.01em}
  .panel .hint{margin:0; font-size:12px; color:var(--muted); font-weight:600}

  .seg{display:flex; background:rgba(27,36,103,.07); border-radius:13px; padding:4px; gap:4px; margin-bottom:16px}
  .seg button{
    flex:1; padding:10px 8px; border-radius:10px; border:none; background:transparent;
    color:var(--navy); font-weight:700; font-size:13.5px; cursor:pointer; transition:background .18s, box-shadow .18s;
  }
  .seg button.act{background:#fff; box-shadow:0 1px 3px rgba(27,36,103,.10); color:var(--navy-deep)}

  /* ---------- premium photo ---------- */
  .photo-wrap{position:relative; border-radius:var(--r-md); overflow:hidden; display:none; aspect-ratio:1/1;
    box-shadow:inset 0 0 0 1px rgba(27,36,103,.08)}
  .photo-wrap img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .photo-cap{
    position:absolute; inset-inline:0; bottom:0; padding:44px 18px 14px; color:#fff; font-weight:700; font-size:14px;
    background:linear-gradient(180deg, transparent, rgba(16,21,62,.78)); pointer-events:none; text-shadow:0 1px 8px rgba(0,0,0,.4);
  }
  .pbadge{
    position:absolute; width:28px; height:28px; border-radius:8px; transform:translate(-50%,-50%);
    background:rgba(16,21,62,.5); backdrop-filter:blur(3px); color:#fff;
    display:grid; place-items:center; font-weight:700; font-size:12.5px; cursor:pointer;
    border:1px solid rgba(255,255,255,.5);
    font-variant-numeric:tabular-nums; transition:background .15s, transform .15s;
  }
  .pbadge:hover{background:var(--tan); color:var(--navy-deep); border-color:var(--tan); transform:translate(-50%,-50%) scale(1.12)}

  .gallery{display:none; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px}
  .gallery button{
    padding:0; border:none; border-radius:var(--r-sm); overflow:hidden; cursor:pointer; background:none; line-height:0;
    outline-offset:2px; position:relative; transition:transform .18s;
  }
  .gallery button::after{content:""; position:absolute; inset:0; border-radius:var(--r-sm);
    box-shadow:inset 0 0 0 1px rgba(27,36,103,.14); transition:box-shadow .18s}
  .gallery button.act::after{box-shadow:inset 0 0 0 3px var(--navy)}
  .gallery button:hover{transform:translateY(-2px)}
  .gallery img{width:100%; height:58px; object-fit:cover; display:block}

  /* ---------- architectural night section ---------- */
  .bld-scene{
    display:none; flex:1; border-radius:var(--r-md); padding:22px 20px 0; position:relative; overflow:hidden;
    background:linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 90%);
    flex-direction:column;
  }
  .scene-body{position:relative; flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    padding-top:150px}
  .scene-body::after{ /* soft ground shadow under the building */
    content:""; position:absolute; inset-inline:6%; bottom:-2px; height:34px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.35), transparent 70%);
  }
  .scene-moon{position:absolute; top:16px; inset-inline-start:12%; width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle at 38% 38%, #FBF3E9, #E9D3BE 60%, #D0A88C);
    box-shadow:0 0 46px 12px rgba(246,233,225,.26); opacity:.9}
  .scene-tagline{position:absolute; top:78px; inset-inline-end:2px; max-width:58%; text-align:right;
    color:rgba(240,238,255,.5); font-size:12px; font-weight:600; line-height:1.7; letter-spacing:.02em}
  .scene-tagline b{display:block; color:var(--tan); font-size:15px; font-weight:800; margin-bottom:4px; letter-spacing:.04em}
  .bld-scene::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:30px 30px;
  }
  .bld-scene::after{
    content:""; position:absolute; width:420px; height:420px; right:-120px; top:-160px; pointer-events:none;
    background:radial-gradient(circle, rgba(208,168,140,.16), transparent 65%);
  }
  .scene-top{position:relative; display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:16px}
  .scene-title{color:#fff; font-weight:800; font-size:15px; letter-spacing:.01em}
  .scene-sub{color:var(--tan); font-weight:700; font-size:12px; letter-spacing:.06em}
  .scene-status{position:relative; display:flex; gap:7px; flex-wrap:wrap; margin-bottom:2px}
  .scene-status .sc{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:#EDEBF5;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); padding:4px 11px; border-radius:999px}
  .scene-status .sc i{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .scene-status .sc b{color:#fff; font-weight:800; font-variant-numeric:tabular-nums}
  .bld{position:relative; display:flex; flex-direction:column; gap:11px; padding-bottom:0; max-width:440px; margin:0 auto; width:100%}
  .bld-roof{
    height:14px; border-radius:8px 8px 0 0; margin:0 38px;
    background:repeating-linear-gradient(90deg, var(--tan) 0 8px, transparent 8px 16px);
    opacity:.75;
  }
  .bfloor{display:flex; gap:8px; align-items:stretch}
  .bfloor::before{content:""; flex:0 0 30px}   /* מרווח מאוזן מימין לסרגל המספרים שמשמאל — הבניין ממורכז */
  .frail{flex:0 0 30px; position:relative; display:grid; place-items:center}
  .frail::before{content:""; position:absolute; top:-8px; bottom:-8px; right:50%; width:1px;
    background:rgba(255,255,255,.14)}
  .fbadge{
    position:relative; width:30px; height:30px; display:grid; place-items:center; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.28); color:#EDE9E0;
    font-size:13.5px; font-weight:800; font-variant-numeric:tabular-nums; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .fbadge:hover{background:var(--tan); color:var(--navy-deep); border-color:var(--tan)}
  .bunits{flex:1; display:flex; gap:9px; min-height:54px}
  .bunit{
    flex:1; border-radius:10px; display:flex; flex-direction:column; justify-content:center; gap:4px;
    padding:9px 13px; cursor:pointer; text-align:right; min-width:0; position:relative;
    border:1px solid; box-shadow:inset 7px 0 0 var(--acc,#2E7D4E);
    transition:transform .16s, filter .16s;
  }
  .bunit:hover, .bunit:focus-visible{transform:translateY(-2px); filter:brightness(1.02)}
  .bunit b{font-size:13px; font-weight:800; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bunit small{font-size:10.5px; color:#6E6A82; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bunit .brow{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:2px}
  /* תגית סטטוס מלאה בצבע — בולטת מאוד */
  .bunit .st{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800;
    color:#fff; background:var(--acc); padding:3px 10px; border-radius:999px; box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .bunit .st svg{width:13px; height:13px; flex:0 0 auto}
  .bunit .planchip{
    display:inline-flex; align-items:center; gap:3px; font-size:9px; font-weight:800; color:var(--tan-deep);
    background:var(--tan-soft); border-radius:5px; padding:2px 6px; white-space:nowrap;
  }
  .terr{
    flex:0 0 54px; border:1.5px dashed rgba(208,168,140,.55); border-radius:11px;
    background:rgba(208,168,140,.09);
    display:grid; place-items:center; font-size:10px; font-weight:700; color:var(--tan); text-align:center; line-height:1.3;
  }
  .garden{
    flex:0 0 88px; border:1.5px solid rgba(140,190,110,.45); border-radius:11px; color:#CDE7BE;
    background:linear-gradient(135deg, rgba(92,138,70,.28), rgba(92,138,70,.5));
    display:grid; place-items:center; font-size:11px; font-weight:800; text-align:center; line-height:1.35;
  }
  .bld-ground{
    height:13px; margin:10px 0 0; position:relative; border-radius:3px;
    background:linear-gradient(90deg, var(--tan-deep), var(--tan) 55%, var(--tan-deep));
  }
  .bld-street{
    position:relative; display:flex; justify-content:space-between; margin:6px 2px 0;
    padding:2px 6px; font-size:11px; letter-spacing:.1em; color:rgba(240,238,255,.6); font-weight:700;
  }

  /* ---------- apartment popover ---------- */
  .unit-pop{
    position:fixed; z-index:70; width:288px; padding:18px 18px 16px;
    background:rgba(255,253,249,.9); backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid rgba(208,168,140,.55); border-radius:18px;
    box-shadow:0 24px 60px rgba(10,14,40,.4);
    animation:popIn .18s ease;
  }
  @keyframes popIn{from{opacity:0; transform:translateY(6px) scale(.97)}to{opacity:1; transform:none}}
  .pop-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
  .pop-head b{font-size:17px; font-weight:800; color:var(--navy)}
  .pop-rows{display:flex; flex-direction:column}
  .pop-row{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid rgba(208,168,140,.28); font-size:13px}
  .pop-row span{color:var(--muted); font-weight:600}
  .pop-row b{color:var(--ink); font-weight:700; text-align:left; font-variant-numeric:tabular-nums}
  .pop-cta{
    width:100%; margin-top:13px; padding:10px; border:none; border-radius:11px; cursor:pointer;
    background:var(--navy); color:#fff; font-weight:700; font-size:13.5px; transition:background .15s;
  }
  .pop-cta:hover{background:var(--navy-soft)}

  /* ---------- floor plans ---------- */
  .pop-plan{
    height:150px; background:#fff; border:1px solid var(--line); border-radius:12px;
    margin-bottom:13px; overflow:hidden; cursor:zoom-in; display:grid; place-items:center; padding:6px;
  }
  .pop-plan img{max-width:100%; max-height:100%; object-fit:contain}
  /* frameless plan preview — גדול, נקי, ללא קופסה/מסגרת מאחור */
  .plan-thumb{
    flex:0 0 auto; width:200px; height:134px; background:none; border:none; border-radius:6px;
    overflow:hidden; cursor:zoom-in; padding:0; display:block; position:relative;
    transition:transform .16s;
  }
  .plan-thumb img{width:100%; height:100%; object-fit:contain; object-position:center; display:block; mix-blend-mode:multiply}
  .plan-thumb::after{
    content:"⤢"; position:absolute; top:4px; inset-inline-start:4px; width:19px; height:19px; border-radius:6px;
    display:grid; place-items:center; font-size:11px; color:var(--navy);
    background:rgba(255,255,255,.85); opacity:0; transition:opacity .16s;
  }
  .plan-thumb:hover{transform:scale(1.04)}
  .plan-thumb:hover::after{opacity:1}
  .lightbox{
    position:fixed; inset:0; z-index:120; background:rgba(12,16,44,.88); backdrop-filter:blur(10px);
    display:grid; place-items:center; padding:28px; cursor:zoom-out; animation:popIn .18s ease;
  }
  .lightbox figure{margin:0; display:flex; flex-direction:column; align-items:center; gap:14px; max-width:min(94vw,1040px)}
  .lightbox img{max-width:100%; max-height:78vh; background:#fff; border-radius:16px; padding:12px; box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .lightbox figcaption{color:#fff; font-weight:700; font-size:15px; text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .lightbox .lb-close{
    position:absolute; top:18px; inset-inline-start:18px; width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff;
    font-size:19px; cursor:pointer; backdrop-filter:blur(6px); z-index:2;
  }
  .lightbox .lb-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:52px; height:52px; border-radius:50%;
    border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff;
    font-size:30px; line-height:1; cursor:pointer; backdrop-filter:blur(6px); display:grid; place-items:center;

  .apt-top .pill{box-shadow:inset 0 0 0 1px currentColor}

  }

  .reveal{opacity:0; transform:translateY(14px); will-change:opacity, transform}
  .reveal.in{opacity:1; transform:none; transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1)}
  .reveal.in{will-change:auto}
  @media (prefers-reduced-motion: reduce){ .reveal{opacity:1; transform:none} }
  .floor-head{display:flex; align-items:center; gap:12px; padding:12px 18px}
  .floor-chip{
    background:var(--navy); color:#fff; font-weight:800; font-size:13px; padding:5px 15px; border-radius:999px;

  .floor{position:relative}
  @media (hover:hover) and (pointer:fine){
    /* תמונת הפרויקט — זום איטי ויוקרתי בסגנון Ken Burns */
    .photo-wrap img{transition:transform 5s cubic-bezier(.22,.61,.36,1)}
    .photo-wrap:hover img{transform:scale(1.07)}
    /* גלריה — התמונה מתקרבת בעדינות בתוך המסגרת */
    .gallery button img{transition:transform .5s ease}
    .gallery button:hover img{transform:scale(1.12)}
    /* כרטיסי הקומות — פס אור חולף (sheen) בריחוף */
    .floor::after{content:""; position:absolute; top:0; bottom:0; width:45%; inset-inline-start:-60%;
      background:linear-gradient(105deg, transparent 25%, rgba(255,255,255,.45) 50%, transparent 75%);
      transform:skewX(-16deg); pointer-events:none; opacity:0}
    .floor:hover::after{animation:sheen .85s ease}
    /* שבבי המפרט — מתעוררים בריחוף על הדירה */
    .chip{transition:border-color .18s, background .18s, transform .18s}
    .apt:hover .chip{border-color:#DEC9B1}
    .chip:hover{background:var(--tan-soft); border-color:var(--tan-deep); transform:translateY(-1px)}
    /* תגית הסטטוס — הרמה קלה */
    .pill:not(.static){transition:filter .15s, transform .15s}
    .pill:not(.static):hover{transform:translateY(-1px)}
    /* התשריט מתקרב יחד עם הריחוף על שורת הדירה */
    .apt:hover .plan-thumb{transform:scale(1.03)}
    /* קוביות החתך — עומק וצל בריחוף */
    .bunit{transition:transform .18s, filter .18s, box-shadow .18s}
    .bunit:hover, .bunit:focus-visible{transform:translateY(-2px) scale(1.015); filter:brightness(1.03);
      box-shadow:inset 7px 0 0 var(--acc,#2E7D4E), 0 12px 26px rgba(0,0,0,.3)}
    .scene-status .sc{transition:background .18s, border-color .18s}
    .scene-status .sc:hover{background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.3)}
    .fbadge{transition:background .15s, color .15s, transform .15s}
    .fbadge:hover{transform:scale(1.12)}
    /* כפתורים */
    .btn-share{transition:background .16s, color .16s, border-color .16s, transform .16s}
    .btn-share:hover{transform:translateY(-1px)}
    .seg button:not(.act):hover{background:rgba(255,255,255,.6)}
    .plans-cta svg{transition:transform .2s, opacity .2s}
    .plans-cta:hover svg{transform:scale(1.18); opacity:1}
    /* הלוגו — הילה חמה עדינה בריחוף */

    .head-brand:hover .logo-img{transform:scale(1.03); filter:drop-shadow(0 0 18px rgba(208,168,140,.35))}
    .foot-logo{transition:transform .4s ease, opacity .4s ease}
    .foot-logo:hover{transform:scale(1.05); opacity:1}
  }
  @keyframes sheen{from{inset-inline-start:-60%; opacity:1} to{inset-inline-start:120%; opacity:1}}
  /* תגי הקומות על תמונת הבניין — דופק עדין שמזמין לחיצה */
  @keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(208,168,140,0)}50%{box-shadow:0 0 0 7px rgba(208,168,140,.22)}}
  .pbadge{animation:badgePulse 3.4s ease-in-out infinite}

  /* ================= MOBILE — נמצא בסוף כדי לגבור על כללי הבסיס ================= */
  @media (max-width:700px){
    /* מקרא הסטטוסים מוסתר במובייל — הצבעים מוסברים בבר הלבן ובחתך עצמו */

    /* ההילה החמה עוברת למרכז, מאחורי הלוגו */
    header.site::after{right:50%; transform:translateX(50%); width:88%}
  }
  @media (max-width:560px){
    .plan-thumb{width:150px; height:100px}
    .apt-bot{gap:10px}
    /* מרחיבים את הכרטיסיה הכחולה לצדדים ומצמצמים מרווחים מיותרים */
    main{padding:0 12px}
    .kpis{padding:0 12px}
    /* הבר הלבן במובייל: סה״כ הדירות בשורה מלאה מעל, 4 הסטטוסים מתחתיו */
    .kpi-card{grid-template-columns:repeat(4,1fr)}

    .kpi.total{grid-column:1/-1; border-bottom:1px solid var(--line); padding:16px 8px 13px}
    .kpi.total b{font-size:34px}
    .kpi.total + .kpi{border-inline-start:none}
    .panel{padding:13px 10px}
    .bld-scene{padding:16px 8px 0}
    .scene-body{padding-top:14px}
    .scene-top{margin-bottom:12px}
    /* שורת הסטטוסים — רשת 2×2 מסודרת */
    .scene-status{display:grid; grid-template-columns:1fr 1fr; gap:7px}
    .scene-status .sc{justify-content:center}
    /* הטקסט השיווקי הופך לזרימה רגילה וממורכז — בלי חלל ריק ענק */
    .scene-tagline{position:static; max-width:none; text-align:center; margin:2px 0 14px;
      inset-inline-end:auto; top:auto; font-size:11.5px}

    /* מצמצמים את סרגל המספרים והמרווחים כדי שהחתך ייכנס במלואו וימורכז */
    .bfloor{gap:5px}
    .bfloor::before{flex:0 0 20px}
    .frail{flex:0 0 20px}
    .fbadge{width:26px; height:26px; font-size:12.5px}

function loadState(){
  if (location.hash.startsWith('#d=')){
    try{
      const s = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      if (s && s.floors) return s;
    }catch(e){}
  }
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.floors) return s;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState(silent){
  state.meta.updatedAt = Date.now();

    history.replaceState(null,'', location.pathname + location.search +
      '#d='+btoa(unescape(encodeURIComponent(JSON.stringify(state)))));

/* ---------- cloud sync (works when self-hosted; falls back to the shareable link) ---------- */
const CLOUD_BASE = 'https://kvdb.io';
const CLOUD_KEY = 'zrubavel15-cloud';   // זוכר את מזהה הדלי גם בין ביקורים — אותו דלי משותף
let cloudId = (new URLSearchParams(location.search)).get('c')
           || (()=>{ try{ return localStorage.getItem(CLOUD_KEY); }catch(e){ return null; } })()
           || null;
function rememberCloud(id){
  cloudId = id;
  try{ localStorage.setItem(CLOUD_KEY, id); }catch(e){}
  const u = new URL(location.href); u.searchParams.set('c', id);
  history.replaceState(null,'', u.pathname + u.search + u.hash);
}
let cloudSaveT = null;
function setSync(mode){
  const el = document.getElementById('sync-ind'); if(!el) return;
  el.classList.remove('cloud','saving');
  if (mode==='cloud'){ el.classList.add('cloud'); el.textContent='מסונכרן בענן'; }
  else if (mode==='saving'){ el.classList.add('saving'); el.textContent='שומר…'; }
  else { el.textContent='שמור בקישור'; }
}
async function cloudSave(){
  try{
    setSync('saving');
    if (!cloudId){
      const r = await fetch(CLOUD_BASE+'/', {method:'POST'});
      if(!r.ok) throw 0;
      rememberCloud((await r.text()).trim());
    }
    const r2 = await fetch(`${CLOUD_BASE}/${cloudId}/state`, {method:'PUT', body: JSON.stringify(state)});
    if(!r2.ok) throw 0;
    setSync('cloud');
  }catch(e){ setSync('local'); }   // חסום/לא זמין → נשמר בקישור המקומי
}
function cloudSaveDebounced(){ clearTimeout(cloudSaveT); cloudSaveT = setTimeout(cloudSave, 700); }
async function cloudInit(){
  if (!cloudId) return;
  try{
    const r = await fetch(`${CLOUD_BASE}/${cloudId}/state`, {cache:'no-store'});
    if(!r.ok) throw 0;
    const s = await r.json();
    if (s && s.floors){ state = s; setSync('cloud'); renderAll(); }
  }catch(e){ setSync('local'); }
}

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tint = (hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;};
const mixWhite = (hex,w)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return `rgb(${Math.round(r+(255-r)*w)},${Math.round(g+(255-g)*w)},${Math.round(b+(255-b)*w)})`;};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }
/* ספירה עולה למספרי הבר הלבן — פעם אחת, בטעינה */
function animateCount(elm, to){
  const dur = 900, t0 = performance.now();
  const step = t=>{
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);   // easeOutCubic
    elm.textContent = Math.round(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- apartment popover ---------- */
let pop=null, popPinned=false, hideT=null, popAnchor=null;
function hidePop(){ if(pop){pop.remove(); pop=null; popPinned=false; popAnchor=null;} }
function placePop(){
  if (!pop || !popAnchor) return;
  const r = popAnchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  if (r.bottom < 0 || r.top > window.innerHeight){ hidePop(); return; }
  let x = r.left - pw - 14;
  if (x < 8) x = Math.min(window.innerWidth - pw - 8, r.right + 14);
  let y = r.top + r.height/2 - ph/2;
  y = Math.max(10, Math.min(window.innerHeight - ph - 10, y));
  pop.style.left = x+'px'; pop.style.top = y+'px';
}
function scheduleHidePop(){ if(popPinned) return; clearTimeout(hideT); hideT=setTimeout(hidePop, 220); }
function showPop(a, anchor){
  clearTimeout(hideT);
  if (pop) { pop.remove(); pop=null; }
  const s = STATUSES[a.status] || STATUSES.marketing;
  const rows = [];
  if (a.rooms) rows.push(['חדרים', a.rooms]);
  rows.push(['שטח', a.size + ' מ״ר']);
  if (a.outdoor) rows.push(['מרפסת / גינה', a.outdoor]);
  if (a.facing) rows.push(['חזית', a.facing]);
  if (a.note) rows.push(['הערה', a.note]);
  const plan = PLANS[a.plan];
  pop = el('div','unit-pop');
  pop.setAttribute('role','dialog'); pop.setAttribute('aria-label', a.name);
  pop.innerHTML = `
    <div class="pop-head"><b>${esc(a.name)}</b>
      <span class="pill static" style="color:${s.color};background:${tint(s.color,.11)}">${s.icon}${esc(s.label)}</span>
    </div>
    ${plan?`<div class="pop-plan" title="להגדלת התשריט"><img src="${plan.src}" alt="${esc(plan.label)}"></div>`:''}
    <div class="pop-rows">${rows.map(r=>`<div class="pop-row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>
    <button class="pop-cta">לכרטיס הדירה המלא</button>`;
  pop.querySelector('.pop-cta').addEventListener('click', ()=>{ hidePop(); focusApt(a.id); });
  if (plan) pop.querySelector('.pop-plan').addEventListener('click', ()=>openLightbox(aptPlan(a)));
  pop.addEventListener('mouseenter', ()=>clearTimeout(hideT));
  pop.addEventListener('mouseleave', scheduleHidePop);
  document.body.appendChild(pop);
  popAnchor = anchor;
  placePop();
}

function lbRender(){
  if (!lbEl) return;

  lbEl.querySelector('.lb-cap').textContent = p.label;

}
function lbGo(d){ lbIdx = (lbIdx + d + lbList.length) % lbList.length; lbRender(); }
/* כיתוב תכנית התואם למאפייני הדירה עצמה — ולא טקסט כללי */
function aptPlan(a){
  const p = PLANS[a.plan];
  if (!p) return null;
  const parts = [a.name];
  if (a.rooms) parts.push(a.rooms);
  parts.push(a.size + ' מ״ר');

  if (a.facing) parts.push(a.facing);

function openLightbox(planOrList, startIdx){
  closeLightbox();

  lbIdx = startIdx || 0;
  lbEl = el('div','lightbox');
  lbEl.setAttribute('role','dialog'); lbEl.setAttribute('aria-label','תכניות הדירות');
  lbEl.innerHTML = `
    <button class="lb-close" aria-label="סגירה">✕</button>

    <button class="lb-nav lb-next" aria-label="הבא">›</button>

      <img class="lb-img" src="" alt="">
      <figcaption class="lb-cap"></figcaption>

/* the facade photo is square and cover-cropped; map image coords to the container */
function positionBadges(){
  const wrapEl = $('#photo'), pb = $('#pbadges');
  const W = wrapEl.clientWidth, H = wrapEl.clientHeight;
  if (!W || !H || !pb.children.length) return;
  const s = Math.max(W, H);
  const offX = (s - W) / 2, offY = (s - H) / 2;
  const left = (0.25 * s - offX) / W * 100;
  for (const b of pb.children){
    const fy = parseFloat(b.dataset.y) / 100;
    b.style.left = left + '%';
    b.style.top = ((fy * s - offY) / H * 100) + '%';
  }
}
window.addEventListener('resize', positionBadges);

const smoothOK = !matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- floor cards ---------- */
function chipsHTML(a){
  const bits = [`<span class="chip">${IC.area}<b>${esc(a.size)}</b>&nbsp;מ״ר</span>`];
  if (a.outdoor) bits.push(`<span class="chip">${IC.out}${esc(a.outdoor)}</span>`);
  if (a.facing) bits.push(`<span class="chip">${IC.face}${esc(a.facing)}</span>`);
  return `<div class="chips">${bits.join('')}</div>`;
}
function renderFloors(){
  const wrap = $('#floors'); wrap.innerHTML='';
  const floors = [...state.floors].sort((x,y)=>y.num-x.num);
  floors.forEach((f, fi)=>{
    const card = el('section','floor'); card.id = 'floor-'+f.id;
    if (!editMode) card.classList.add('reveal');
    const head = el('div','floor-head');
    head.appendChild(el('span','floor-chip',esc(f.label)));
    head.appendChild(el('span','cnt', f.apts.length===1?'דירה אחת':f.apts.length+' דירות'));
    if (editMode){
      const tools = el('div','tools');
      const add = el('button','mini-btn','+ הוספת דירה');
      add.addEventListener('click',()=>{
        f.apts.push(apt(uid(),'דירה חדשה','3 חדרים','70','מרפסת 12 מ״ר','חזית לרחוב זרובבל','big','typical'));
        saveState();
      });
      tools.appendChild(add);
      if (f.apts.length===0){
        const del = el('button','mini-btn danger','מחיקת קומה');
        del.addEventListener('click',()=>{ state.floors = state.floors.filter(x=>x!==f); saveState(); });
        tools.appendChild(del);
      }
      head.appendChild(tools);
    }
    card.appendChild(head);

    for (const a of f.apts){
      const row = el('div','apt'); row.id = 'apt-'+a.id;
      if (editMode){
        const info = el('div','info');
        info.innerHTML = `<div class="egrid">
          <label class="efield">שם הדירה<input data-k="name" value="${esc(a.name)}"></label>
          <label class="efield">חדרים<input data-k="rooms" value="${esc(a.rooms)}" placeholder="למשל: 3 חדרים"></label>
          <label class="efield">שטח (מ״ר)<input data-k="size" value="${esc(a.size)}" inputmode="numeric"></label>
          <label class="efield">מרפסת / גינה<input data-k="outdoor" value="${esc(a.outdoor)}"></label>
          <label class="efield">חזית / כיוון<input data-k="facing" value="${esc(a.facing)}"></label>
          <label class="efield">הערה (יוצג לקונים)<input data-k="note" value="${esc(a.note)}" placeholder="למשל: מחיר, מועד מסירה"></label>
        </div>`;
        info.querySelectorAll('input').forEach(inp=>{
          inp.addEventListener('change',()=>{ a[inp.dataset.k]=inp.value; saveState(true); toast('נשמר ✓'); });
        });
        const sp = el('div','status-picker');
        for (const k of Object.keys(STATUSES)){
          const s=STATUSES[k];
          const b = el('button',null,s.label);
          if (k===a.status){ b.style.background=s.color; b.style.borderColor=s.color; b.style.color='#fff'; }
          b.addEventListener('click',()=>{ a.status=k; saveState(); });
          sp.appendChild(b);
        }
        info.appendChild(sp);
        const del = el('button','mini-btn danger','מחיקת דירה');
        del.style.alignSelf='flex-start';
        del.addEventListener('click',()=>{
          if (confirm(`למחוק את "${a.name}"?`)){ f.apts = f.apts.filter(x=>x!==a); saveState(); }
        });
        info.appendChild(del);
        row.appendChild(info);
      } else {
        const plan = PLANS[a.plan];
        // TOP LINE: name (right) · status (left)
        const top = el('div','apt-top');
        const nm = a.rooms
          ? `${esc(a.name)}<span class="nm-sep">·</span><span class="rooms">${esc(a.rooms)}</span>`
          : esc(a.name);
        top.appendChild(el('div','name', nm));
        top.appendChild(makeStatusPill(a));   // הסטטוס תמיד בשורה העליונה, מעל הקו המפריד
        row.appendChild(top);
        // BOTTOM LINE: spec chips (right) · frameless plan preview (left)
        const bot = el('div','apt-bot');
        const chips = el('div',null, chipsHTML(a)); // wrapper so chips sit on the right
        bot.appendChild(chips.firstElementChild);
        if (plan){
          const th = el('button','plan-thumb', `<img src="${plan.src}" alt="${esc(plan.label)}">`);
          th.title = a.name + ' — להגדלת התכנית';
          th.setAttribute('aria-label', a.name + ' — הגדלת התכנית');
          th.addEventListener('click', ()=>openLightbox(aptPlan(a)));
          bot.appendChild(th);
        }
        row.appendChild(bot);
        if (a.note) row.appendChild(el('div','note', esc(a.note)));
      }
      card.appendChild(row);
    }
    wrap.appendChild(card);
  });
  if (editMode){
    const addF = el('button','btn tan add-floor','+ הוספת קומה');
    addF.style.color = 'var(--navy-deep)';
    addF.addEventListener('click',()=>{
      const num = Math.max(0,...state.floors.map(f=>f.num))+1;
      state.floors.unshift({id:uid(),num,label:'קומה '+num,apts:[]});
      saveState();
    });
    wrap.appendChild(addF);
    const reset = el('button','mini-btn','↺ איפוס לנתוני ברירת המחדל');
    reset.style.alignSelf='center';
    reset.addEventListener('click',()=>{
      if(confirm('לאפס את כל הנתונים לברירת המחדל? פעולה זו תמחק את כל השינויים.')){
        state = JSON.parse(JSON.stringify(DEFAULT_STATE)); saveState();
      }
    });
    wrap.appendChild(reset);
  }
}

/* ---------- meta ---------- */
function renderMeta(){
  const t=$('#m-title'), s=$('#m-subtitle'), tg=$('#m-tagline'), f1=$('#m-foot1'), f2=$('#m-foot2');
  t.textContent = state.meta.title; s.textContent = state.meta.subtitle;
  // תאימות למצב שמור ישן — ברירות מחדל לשדות שנוספו מאוחר יותר
  tg.textContent = state.meta.tagline || 'היהלום בין הכרם לים';
  f1.textContent = state.meta.foot1 || 'הזדמנות אחרונה להצטרף לנבחרת מנצחת';
  f2.textContent = state.meta.foot2 || 'בפריים לוקיישן בין הכרם לים';
  for (const [node,key] of [[t,'title'],[s,'subtitle'],[tg,'tagline'],[f1,'foot1'],[f2,'foot2']]){
    node.contentEditable = editMode ? 'true' : 'false';
    node.onblur = editMode ? ()=>{ state.meta[key]=node.textContent.trim(); saveState(true); toast('נשמר ✓'); } : null;
  }
}

let revealObserver = null, revealFailsafe = null;
function setupReveals(){
  const els = [...document.querySelectorAll('.reveal:not(.in)')];
  if (!els.length) return;
  if (!('IntersectionObserver' in window)) { els.forEach(e=>e.classList.add('in')); return; }
  if (!revealObserver){
    revealObserver = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{ if (en.isIntersecting){ en.target.classList.add('in'); revealObserver.unobserve(en.target); } });
    }, {rootMargin:'0px 0px 90px 0px', threshold:0});   // נחשף מעט לפני הכניסה למסך — חלק יותר
  }
  els.forEach(e=>revealObserver.observe(e));
  // בטיחות: תוכן לעולם לא נשאר מוסתר, גם אם אין גלילה
  clearTimeout(revealFailsafe);
  revealFailsafe = setTimeout(()=>document.querySelectorAll('.reveal:not(.in)').forEach(e=>e.classList.add('in')), 1500);
}
function renderAll(){ hidePop(); renderMeta(); renderKpis(); renderBld(); renderFloors(); setupReveals(); }

  renderAll();

  if (editMode) cloudSave();

$('#btn-share').addEventListener('click',async ()=>{
  saveState(true);
  // מוודאים שהדלי בענן קיים לפני ההעתקה — כדי שהקישור יכיל את מזהה הענן (?c=) ויהיה חי
  try{ await cloudSave(); }catch(e){}
  const url = location.href;
  const live = !!cloudId;   // האם הצלחנו לסנכרן בענן
  const shareData = {
    title: state.meta.title || 'זרובבל 15',
    text: `סטטוס הדירות בפרויקט ${state.meta.title || 'זרובבל 15'} — ${state.meta.address||''}`.trim(),
    url,
  };
  // בטלפונים: פותח את גיליון השיתוף המובנה (וואטסאפ / מייל / הודעות)
  if (navigator.share){
    try{ await navigator.share(shareData); return; }
    catch(e){ if (e && e.name === 'AbortError') return; }
  }
  // במחשב: העתקה ללוח
  const msg = live ? 'הקישור הועתק — קישור חי, כל עדכון יופיע למי שנכנס' : 'הקישור הועתק — מכיל את הסטטוסים הנוכחיים';
  try{ await navigator.clipboard.writeText(url); toast(msg); }
  catch(e){ prompt('העתיקו את הקישור:', url); }
});

/* ---------- tabs ---------- */
function setTab(which){
  const photo = which==='photo';
  $('#tab-photo').classList.toggle('act',photo);
  $('#tab-schema').classList.toggle('act',!photo);
  $('#photo').style.display = photo?'block':'none';
  $('#gallery').style.display = photo?'grid':'none';
  $('#scene').style.display = photo?'none':'flex';
  updateStickiness();
  if (photo) positionBadges();
}
/* הפאנל דביק רק כשהוא נכנס במלואו במסך — אחרת גלילה רגילה, בלי היתקעות */
function updateStickiness(){
  const vp = document.querySelector('.viz-panel');
  const panel = vp && vp.firstElementChild;
  if (!panel) return;
  vp.style.alignSelf = 'start';
  // דביקות רלוונטית רק בפריסת שתי-העמודות בדסקטופ. במובייל (עמודה אחת) —
  // תמיד סטטי, אחרת הפאנל "ננעץ" למעלה והגלילה נתקעת.
  const singleCol = window.innerWidth <= 960;
  const fits = !singleCol && panel.getBoundingClientRect().height <= (window.innerHeight - 24);
  vp.style.position = fits ? 'sticky' : 'static';
  vp.style.top = fits ? '16px' : '';
}
let stickT=null;
window.addEventListener('resize', ()=>{ clearTimeout(stickT); stickT=setTimeout(()=>{ updateStickiness(); positionBadges(); },120); });
$('#tab-photo').addEventListener('click',()=>setTab('photo'));
$('#tab-schema').addEventListener('click',()=>setTab('schema'));
